name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SCOMM_OFFICE_BASE_URL: https://office.scomm.ai
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Pages artifact
        run: pnpm --filter @scomm-office/outlook-addin build:pages

      - name: Confirm hosted manifest
        run: |
          test -f apps/outlook-addin/dist/manifest.xml
          test -f apps/outlook-addin/dist/.nojekyll
          test -f apps/outlook-addin/dist/index.html
          grep -q 'https://office.scomm.ai/taskpane.html' apps/outlook-addin/dist/manifest.xml
          ! grep -q 'https://localhost:5173' apps/outlook-addin/dist/manifest.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/outlook-addin/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
