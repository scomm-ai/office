name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scomm_office
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5433/scomm_office
      SCOMM_DEV_TOKEN: dev-token-ci
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Checkout 2key billing SDKs (sibling)
        env:
          SDK_TOKEN: ${{ secrets.TWOKEY_BILLING_SDKS_TOKEN }}
        run: |
          dest="$GITHUB_WORKSPACE/../2key-billing-sdks"
          branch="main"
          if [ -n "$SDK_TOKEN" ]; then
            git clone --depth 1 --branch "$branch" \
              "https://x-access-token:${SDK_TOKEN}@github.com/2keyapp/2key-billing-sdks.git" \
              "$dest"
          else
            git clone --depth 1 --branch "$branch" \
              https://github.com/2keyapp/2key-billing-sdks.git \
              "$dest"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build @2key/browser-sdk
        run: pnpm --filter @2key/browser-sdk... run build

      - name: Forbid local billing / Better Auth
        run: |
          test ! -d packages/billing
          if grep -R -n -E "better-auth|@scomm-office/billing" \
            --exclude-dir=node_modules --exclude-dir=dist \
            apps packages; then
            echo "Forbidden billing client import" >&2
            exit 1
          fi

      - name: Build packages
        run: pnpm -r --filter './packages/**' --sort run build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
