<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Signing in…</title>
    <style>
      body { font-family: "Segoe UI", system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f4f6f8; color: #1f2933; }
      .card { text-align: center; padding: 2rem; }
      .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #d8dee6; border-top-color: #2f6fab; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <p id="msg">Redirecting to sign-in…</p>
    </div>
    <script>
      (async function () {
        var params = new URLSearchParams(window.location.search);
        var provider = params.get("provider");
        var origin = params.get("origin");
        var callbackURL = params.get("callbackURL");

        if (!provider || !origin) {
          document.getElementById("msg").textContent = "Missing sign-in parameters.";
          return;
        }

        try {
          var res = await fetch(origin + "/api/auth/sign-in/social", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            credentials: "include",
            body: JSON.stringify({ provider: provider, callbackURL: callbackURL }),
          });

          if (!res.ok) throw new Error("HTTP " + res.status);

          var body = await res.json();
          var url = body.url || (body.data && body.data.url);

          if (url) {
            window.location.href = url;
          } else {
            document.getElementById("msg").textContent = "No redirect URL received.";
          }
        } catch (e) {
          document.getElementById("msg").textContent = "Sign-in failed: " + e.message;
        }
      })();
    </script>
  </body>
</html>
